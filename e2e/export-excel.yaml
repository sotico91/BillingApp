# Settings → "Exportar a Excel (por año)" builds the year's .xlsx and opens the
# share sheet with it. A build without store keys has Pro off, so nothing is
# locked here; the Pro gate is in e2e/pro/. The sheets are covered by jest
# (src/utils/__tests__/excelExport.test.ts).
appId: com.sotico91.rumi
---
- runFlow: subflows/fresh-start.yaml
- runFlow:
    file: subflows/quick-spend.yaml
    env:
      AMOUNT: "15000"
      NOTE: "almuerzo"
- tapOn: "Guardar \\$15\\.000"
- extendedWaitUntil:
    visible: "Inicio"
    timeout: 10000
- tapOn:
    point: "90%,10%"
- tapOn: ".*Exportar a Excel \\(por año\\).*"
- extendedWaitUntil:
    visible: ".*Rumi-20\\d\\d-movimientos.*"
    timeout: 10000
