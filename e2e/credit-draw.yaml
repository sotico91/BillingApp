# Crédito rotativo kept under "Créditos y cuotas": marked as rotativo, it shows up
# as a Move source and can only land in the main bank. The bank grows, the debt
# grows the same, and Activity names it as an advance.
appId: com.sotico91.rumi
---
- runFlow: subflows/fresh-start.yaml
# A rotativo loan with $3.000.000 of cupo, nothing used yet.
- tapOn: "Patrimonio"
- scrollUntilVisible:
    element: "Agregar crédito"
- tapOn: "Agregar crédito"
- tapOn:
    id: "debt-name"
- inputText: "Rotativo"
# Close the keyboard (tap a label) before the next field.
- tapOn: "Qué estás pagando"
- scrollUntilVisible:
    element: "Sí, es rotativo"
- tapOn: "Sí, es rotativo"
- tapOn:
    id: "debt-limit"
- inputText: "3000000"
- tapOn: "Cupo total"
- scrollUntilVisible:
    element: "Guardar"
- tapOn: "Guardar"
- tapOn: "Inicio"
# Move $500.000 from the rotativo: the only destination is the main bank.
- tapOn:
    id: "add-fab"
- tapOn: "Mover"
- tapOn:
    id: "flow-amount"
- inputText: "500000"
- tapOn: "¿De cuánto fue?"
- tapOn: "Continuar"
- assertVisible: "¿Desde qué cuenta?"
- tapOn: "Cambiar la cuenta"
- tapOn: ".*Rotativo.*"
- assertVisible: ".*Banco principal.*"
- assertNotVisible: ".*Efectivo.*"
- assertNotVisible: ".*Inversiones.*"
- tapOn: "Continuar"
- assertVisible: "Avance"
- assertVisible: "Avance o uso del cupo hacia tu cuenta\\. No es ingreso: la deuda sube lo mismo\\."
- tapOn: "Sí, guardar"
# First movement: iOS asks for notifications (Maestro can't pre-grant them).
- tapOn:
    text: "Permitir"
    optional: true
- extendedWaitUntil:
    visible: "Inicio"
    timeout: 10000
- assertVisible: ".*1\\.500\\.000.*"
- tapOn: "Patrimonio"
# The rotativo: owes $500.000, $2.500.000 of cupo left.
- scrollUntilVisible:
    element: "Cupo disponible: \\$2\\.500\\.000"
- assertVisible: "Rotativo"
- takeScreenshot: credit-draw-wealth
- tapOn: "Actividad"
- assertVisible: ".*Avance · Rotativo → Banco principal.*"
