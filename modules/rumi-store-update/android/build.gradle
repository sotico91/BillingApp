plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.sotico91.rumi'
version = '1.0.0'

android {
  namespace "expo.modules.rumistoreupdate"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Google Play in-app updates (Play Core).
  implementation "com.google.android.play:app-update:2.1.0"
}
